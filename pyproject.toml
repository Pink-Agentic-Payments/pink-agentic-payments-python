[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pink-agentic-payments"
version = "0.1.0"
description = "Python client for Pink Agentic AI Payments: the approval layer between AI agents and company money (sandbox)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "PinkWallet", email = "support@pinkwallet.com" },
]
keywords = ["ai-agents", "agentic-payments", "mcp", "payments", "spending-limits", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://pinkwallet.com/agentic/"
Documentation = "https://pinkwallet.com/agentic/developers/"
Source = "https://github.com/Pink-Agentic-Payments/pink-agentic-payments-python"
Issues = "https://github.com/Pink-Agentic-Payments/pink-agentic-payments-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pink_agentic_payments"]

[tool.hatch.build.targets.sdist]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "NOTES.md",
    "pyproject.toml",
]
exclude = [
    ".venv*",
    "dist",
    "build",
    "*.egg-info",
    "__pycache__",
    ".pytest_cache",
]
